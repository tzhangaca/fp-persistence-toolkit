[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-persistence-toolkit"
version = "0.2.1"
description = "Toolkit for auditing repeated false-positive recurrence and comparing AI/ML fraud-screening model instances"
readme = "README.md"
authors = [{name = "Tongchen Zhang"}]
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["fp-persistence-audit>=0.1.2,<0.1.4"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
fp-persistence-toolkit = "persistence_toolkit.__main__:main"

[tool.setuptools.packages.find]
include = ["persistence_toolkit*"]

[project.urls]
Homepage = "https://github.com/tzhangaca/fp-persistence-toolkit"
Repository = "https://github.com/tzhangaca/fp-persistence-toolkit"
Issues = "https://github.com/tzhangaca/fp-persistence-toolkit/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
